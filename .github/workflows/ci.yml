name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Prolog e Python rodam dentro da imagem oficial do SWI-Prolog (Docker Hub).
  # Antes o SWI-Prolog vinha do PPA do launchpad, que caiu em 11/11 e derrubou o CI.
  prolog:
    runs-on: ubuntu-latest
    container: swipl:10.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Testes plunit
        run: |
          for f in prolog/test_*.pl; do
            swipl --on-error=status -g "load_files('$f'),run_tests" -t halt
          done

  python:
    runs-on: ubuntu-latest
    container: swipl:10.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Compilador e cabeçalhos do Python (o janus-swi compila contra o SWI-Prolog)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev python3-dev
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        working-directory: server
        env:
          CFLAGS: -Wno-error=incompatible-pointer-types -Wno-incompatible-pointer-types
        run: |
          uv sync
          uv run pytest

  elm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o script armadilhas compara com a main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Formato, armadilhas, testes e build
        working-directory: web
        run: |
          npm ci
          npm run check
